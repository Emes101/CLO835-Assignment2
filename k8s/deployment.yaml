# TODO: a Deployment that runs 3 replicas of YOUR image.
#
# Requirements for this assignment:
#   - replicas must be 3.
#   - the container serves on port 8080.
#   - the image must come from Docker Hub, built by your pipeline.
#   - the selector must match the labels in the Pod template.
#
# Docs: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clo835-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: clo835-app
  template:
    metadata:
      labels:
        app: clo835-app
    spec:
      containers:
        - name: clo835-app
          image: emes101/clo835-assignment2:0.2
          ports:
            - containerPort: 8080
