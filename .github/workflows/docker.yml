# TODO: build your image and push it to Docker Hub on every push to your
# default branch.
#
# Use the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
# Do NOT write a password or a token in this file.
#
# The Kubernetes nodes are x86_64, so build for linux/amd64.
name: Build and Push to Docker Hub

on:
  push:
    # GitHub names the first branch "main". The course repository uses
    # "master". Both names are here, so the pipeline runs either way.
    branches: [ master, main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            emes101/clo835-assignment2:0.3
            emes101/clo835-assignment2:${{ github.sha }}
